<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — ЭДО КГБУЗ КККВД №1</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      background-image:
        radial-gradient(circle at 20% 50%, rgba(45, 66, 117, 0.8) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(29, 78, 216, 0.15) 0%, transparent 50%);
      padding: 1rem;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-icon {
      width: 56px;
      height: 56px;
      background: var(--blue);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.5rem;
      color: white;
      box-shadow: 0 8px 24px rgba(29, 78, 216, 0.4);
    }

    .login-title {
      font-family: var(--font-head);
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .login-subtitle {
      font-size: 0.82rem;
      color: rgba(200, 214, 240, 0.7);
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 2rem;
    }

    .login-card .form-label {
      color: rgba(200, 214, 240, 0.8);
    }

    .login-card .form-control {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .login-card .form-control::placeholder { color: rgba(200, 214, 240, 0.4); }
    .login-card .form-control:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--blue-light);
      color: #ffffff;
    }

    .login-input-wrap {
      position: relative;
    }
    .login-input-wrap i {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(200, 214, 240, 0.4);
      font-size: 0.9rem;
      pointer-events: none;
    }
    .login-input-wrap .form-control {
      padding-left: 2.25rem;
    }

    .btn-login {
      width: 100%;
      padding: 0.65rem;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-head);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.02em;
      margin-top: 0.25rem;
    }
    .btn-login:hover { background: #1a45c2; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(29,78,216,0.4); }
    .btn-login:active { transform: translateY(0); }

    .error-msg {
      background: rgba(185, 28, 28, 0.15);
      border: 1px solid rgba(185, 28, 28, 0.3);
      border-radius: var(--radius);
      padding: 0.65rem 0.875rem;
      font-size: 0.82rem;
      color: #fca5a5;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(200, 214, 240, 0.4);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <div class="login-icon"><i class="bi bi-file-earmark-check"></i></div>
      <div class="login-title">ЭДО КГБУЗ КККВД №1</div>
      <div class="login-subtitle">Система электронного документооборота</div>
    </div>

    <div class="login-card">
      <div id="error-block" class="error-msg" style="display:none">
        <i class="bi bi-exclamation-circle"></i>
        <span>Неверный логин или пароль</span>
      </div>

      <form action="/login" method="post">
        <div class="form-group">
          <label class="form-label">Логин</label>
          <div class="login-input-wrap">
            <i class="bi bi-person"></i>
            <input type="text" name="username" class="form-control" placeholder="Введите логин" required autofocus>
          </div>
        </div>

        <div class="form-group" style="margin-top:1rem">
          <label class="form-label">Пароль</label>
          <div class="login-input-wrap">
            <i class="bi bi-lock"></i>
            <input type="password" name="password" class="form-control" placeholder="Введите пароль" required>
          </div>
        </div>

        <div style="margin-top:1.5rem">
          <button type="submit" class="btn-login">Войти в систему</button>
        </div>
      </form>
    </div>

    <div class="login-footer">
      КГБУЗ КККВД №1 &mdash; Внутренняя система документооборота
    </div>
  </div>

  <script>
    // Показать ошибку если ?error=true
    if (new URLSearchParams(window.location.search).has('error')) {
      document.getElementById('error-block').style.display = 'flex';
    }
    // Редирект если уже залогинен
    fetch('/api/auth/me', { credentials: 'same-origin' }).then(r => {
      if (r.ok) window.location.href = '/pages/dashboard.html';
    });
  </script>
</body>
</html>
