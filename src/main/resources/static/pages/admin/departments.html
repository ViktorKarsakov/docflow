<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отделы — ЭДО</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <span class="topbar-title" id="topbar-title">Отделы</span>
      <div class="topbar-actions">
        <a href="/pages/notifications.html" class="notif-btn">
          <i class="bi bi-bell"></i>
          <span class="notif-dot" id="notif-dot" style="display:none"></span>
        </a>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-title">Отделы</div>
          <div class="page-subtitle">Управление подразделениями организации</div>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-primary" onclick="DepartmentsAdmin.openCreate()">
            <i class="bi bi-plus-lg"></i> Добавить отдел
          </button>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>Название</th><th>Код</th><th>Город</th><th></th></tr>
            </thead>
            <tbody id="depts-table-body">
              <tr><td colspan="4"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Модалка отдела -->
<div class="modal-overlay hidden" id="dept-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="dept-modal-title">Отдел</span>
      <button class="modal-close" onclick="hideModal('dept-modal')"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <form id="dept-form" onsubmit="event.preventDefault()">
        <div class="form-group">
          <label class="form-label">Название <span class="required">*</span></label>
          <input type="text" class="form-control" id="dept-name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Код <span class="required">*</span></label>
            <input type="text" class="form-control" id="dept-code" required placeholder="IT, HR, BUCH...">
          </div>
          <div class="form-group">
            <label class="form-label">Город</label>
            <input type="text" class="form-control" id="dept-city" placeholder="Красноярск">
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="hideModal('dept-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="DepartmentsAdmin.save()">
        <i class="bi bi-floppy"></i> Сохранить
      </button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/admin/departments.js"></script>
<script>
(async () => {
  await Layout.init('Отделы');
  await DepartmentsAdmin.load();
})();
</script>
</body>
</html>
