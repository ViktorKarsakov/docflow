<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уведомления — ЭДО</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition);
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-item.unread { background: var(--blue-pale); }
    .notif-item:hover { background: var(--surface-alt); }
    .notif-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .notif-body { flex: 1; min-width: 0; }
    .notif-title { font-weight: 600; font-size: 0.875rem; color: var(--text); }
    .notif-message { font-size: 0.82rem; color: var(--text-sec); margin-top: 0.2rem; }
    .notif-time { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .notif-actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <span class="topbar-title" id="topbar-title">Уведомления</span>
      <div class="topbar-actions">
        <a href="/pages/notifications.html" class="notif-btn">
          <i class="bi bi-bell"></i>
          <span class="notif-dot" id="notif-dot" style="display:none"></span>
        </a>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-title">Уведомления</div>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-secondary" onclick="Notifications.markAllRead()">
            <i class="bi bi-check2-all"></i> Прочитать все
          </button>
        </div>
      </div>

      <div class="card">
        <div id="notif-container">
          <div class="loading-overlay"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/notifications.js"></script>
<script>
(async () => {
  await Layout.init('Уведомления');
  await Notifications.load('notif-container');
})();
</script>
</body>
</html>
