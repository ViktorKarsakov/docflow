<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поручения — ЭДО</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <span class="topbar-title" id="topbar-title">Поручения</span>
      <div class="topbar-actions">
        <a href="/pages/notifications.html" class="notif-btn">
          <i class="bi bi-bell"></i>
          <span class="notif-dot" id="notif-dot" style="display:none"></span>
        </a>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-title">Поручения</div>
          <div class="page-subtitle">Задачи назначенные вам и выданные вами</div>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-primary" onclick="showModal('new-task-modal')">
            <i class="bi bi-plus-lg"></i> Новое поручение
          </button>
        </div>
      </div>

      <div class="tabs" id="tasks-tabs">
        <button class="tab-btn active" data-tab="tab-my"><i class="bi bi-inbox"></i> Мне назначено</button>
        <button class="tab-btn" data-tab="tab-issued"><i class="bi bi-send"></i> Я выдал</button>
      </div>

      <div id="tab-my" class="tab-panel active">
        <div class="card">
          <div id="my-tasks-container">
            <div class="loading-overlay"><div class="spinner"></div></div>
          </div>
        </div>
      </div>

      <div id="tab-issued" class="tab-panel">
        <div class="card">
          <div id="issued-tasks-container">
            <div class="loading-overlay"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Модалка завершения -->
<div class="modal-overlay hidden" id="complete-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Отметить выполненным</span>
      <button class="modal-close" onclick="hideModal('complete-modal')"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Отчёт об исполнении</label>
        <textarea class="form-control" id="complete-report" rows="4"
                  placeholder="Опишите что было сделано..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="hideModal('complete-modal')">Отмена</button>
      <button class="btn btn-success" onclick="Tasks.completeTask()">
        <i class="bi bi-check-lg"></i> Выполнено
      </button>
    </div>
  </div>
</div>

<!-- Модалка нового поручения -->
<div class="modal-overlay hidden" id="new-task-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Новое поручение</span>
      <button class="modal-close" onclick="hideModal('new-task-modal')"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Исполнитель <span class="required">*</span></label>
        <div class="search-field" style="margin-bottom:0.5rem">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="new-task-search"
                 placeholder="Начните вводить имя..." oninput="searchAssignee(this.value)">
        </div>
        <select class="form-control" id="new-task-assignee" size="4" style="height:auto"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Название <span class="required">*</span></label>
        <input type="text" class="form-control" id="new-task-title">
      </div>
      <div class="form-group">
        <label class="form-label">Описание</label>
        <textarea class="form-control" id="new-task-desc" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Срок <span class="required">*</span></label>
        <input type="date" class="form-control" id="new-task-deadline">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="hideModal('new-task-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="createNewTask()">
        <i class="bi bi-send"></i> Выдать поручение
      </button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/tasks.js"></script>
<script>
(async () => {
  await Layout.init('Поручения');
  initTabs('#tasks-tabs');

  document.getElementById('new-task-deadline').min = new Date().toISOString().split('T')[0];

  await Promise.all([
    Tasks.loadMyTasks('my-tasks-container'),
    Tasks.loadIssuedByMe('issued-tasks-container'),
  ]);
})();

const searchAssignee = debounce(async (query) => {
  if (query.length < 2) return;
  const users = await API.users.search(query).catch(() => []);
  const select = document.getElementById('new-task-assignee');
  select.innerHTML = users.map(u =>
    `<option value="${u.id}">${u.fullName} — ${u.departmentName || u.position}</option>`
  ).join('');
}, 300);

async function createNewTask() {
  const assigneeEl = document.getElementById('new-task-assignee');
  const assignedToId = assigneeEl.value ? Number(assigneeEl.value) : null;
  const title    = document.getElementById('new-task-title').value.trim();
  const deadline = document.getElementById('new-task-deadline').value;

  if (!assignedToId) { showToast('Выберите исполнителя', 'error'); return; }
  if (!title)        { showToast('Введите название', 'error'); return; }
  if (!deadline)     { showToast('Укажите срок', 'error'); return; }

  const ok = await Tasks.createTask({
    title,
    description:  document.getElementById('new-task-desc').value || null,
    assignedToId,
    deadline,
  });
  if (ok) {
    hideModal('new-task-modal');
    await Tasks.loadIssuedByMe('issued-tasks-container');
  }
}
</script>
</body>
</html>
